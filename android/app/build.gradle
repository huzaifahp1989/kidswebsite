plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.imedia.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.imedia.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
    
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // WebView for React app integration
    implementation 'androidx.webkit:webkit:1.9.0'

    // Google Play In-App Review
    implementation 'com.google.android.play:review:2.0.2'
    
    // Audio playback
    implementation 'androidx.media:media:1.7.0'
    
    // OneSignal push notifications
    implementation 'com.onesignal:OneSignal:[5.6.1, 5.9.99]'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('NOTE: android/app/google-services.json not found. Add it from Firebase for FCM push delivery.')
}
